<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot tâm lý - thử nghiệm</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280; --user: #2563eb; --border: #e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1b1f24; --text: #e6e8eb; --muted: #9aa3ad; --user: #3b82f6; --border: #2b3138; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 18px; margin: 0; }
  #log { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; background: var(--card); border: 1px solid var(--border); }
  .user { align-self: flex-end; background: var(--user); color: #fff; border: none; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; }
  button { padding: 0 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font: inherit; }
  button.primary { background: var(--user); color: #fff; border: none; }
  label { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Chatbot tâm lý (thử nghiệm)</h1>
    <div><label><input type="checkbox" id="debug"> chi tiết</label> <button id="reset" type="button">Phiên mới</button></div>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="m" rows="2" placeholder="Nhập tin nhắn..." required></textarea>
    <button class="primary" type="submit">Gửi</button>
  </form>
</main>
<script>
let sid = null;
const log = document.getElementById("log"), box = document.getElementById("m"), dbg = document.getElementById("debug");
function add(text, cls, meta) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
document.getElementById("reset").onclick = () => { sid = null; log.innerHTML = ""; };
box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const text = box.value.trim(); if (!text) return;
  add(text, "user"); box.value = "";
  const wait = add("…", "bot");
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, session_id: sid }) });
    const j = await r.json(); sid = j.session_id; wait.remove();
    const states = Object.entries(j.states || {}).map(([k, v]) => `${k.replace("_state", "")}=${v ?? "?"}`).join(", ");
    add(j.reply, "bot", dbg.checked ? `nhánh: ${j.branch} | ${states} | thuốc: ${j.medication} | ${j.latency_s}s` : null);
  } catch (err) { wait.textContent = "Lỗi: " + err; }
};
</script>
</body>
</html>
